<header class="hdr" data-bc="a">
  <div class="brand">
    <span class="mark">
      <svg class="mark-ret" viewBox="0 0 16 16" aria-hidden="true"><circle class="crn" cx="3" cy="3" r="1.3"/><circle class="crn" cx="13" cy="3" r="1.3"/><circle class="crn" cx="3" cy="13" r="1.3"/><circle class="crn" cx="13" cy="13" r="1.3"/><circle class="crn hot" cx="8" cy="8" r="1.6"/></svg>
      <span class="mark-stack">
        <span class="mark-tx">SITREP</span>
        <span class="brand-tag">OSINT // IDN</span>
      </span>
    </span>
    <span class="brand-case">
      <span class="bc-a">
        <span class="bc-loc">Indonesia</span>
        <span class="bc-meta">
          <span class="bc-scope">Demo, insiden &amp; bencana</span>
          <span class="bc-mixrow">
            <span class="bc-mix" id="bc-mix" data-empty aria-hidden="true">
              <i style="--c:#f1c21b"></i><i style="--c:#8d8d8d"></i><i style="--c:#be95ff"></i>
            </span>
            <span class="bc-sum" id="bc-sum">— titik · 24j</span>
          </span>
        </span>
      </span>
      <span class="bc-b">
        <span class="bc-loc">Indonesia</span>
        <span class="bc-rule" aria-hidden="true"></span>
        <span class="bc-stats">
          <span class="bc-stat" style="--c:#f1c21b"><b data-bc="demo">–</b><span>Demo</span></span>
          <span class="bc-stat" style="--c:#8d8d8d"><b data-bc="insiden">–</b><span>Insiden</span></span>
          <span class="bc-stat" style="--c:#be95ff"><b data-bc="bencana">–</b><span>Bencana</span></span>
        </span>
      </span>
    </span>
  </div>
  <div class="hdr-tools">
    <div class="hdr-dock">
      <span class="hstat hstat-live"><i class="dot"></i>Live</span>
      <span class="hdr-dock-sep" aria-hidden="true"></span>
      <span class="hstat" id="clock">--:--:-- WIB</span>
    </div>
    <button class="btn hdr-sync" id="btn-refresh" type="button" data-state="idle" title="Tarik ulang semua sumber (R)">
      <svg class="ic" aria-hidden="true"><use href="#i-sync"></use></svg>
      <span class="btn-tx">Sync</span>
      <span class="hstat" id="countdown">02:00</span>
      <span class="sync-rail" aria-hidden="true"></span>
    </button>
  </div>
</header>
