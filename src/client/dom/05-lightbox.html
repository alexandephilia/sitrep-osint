<div class="glb" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Player CCTV besar">
  <button class="gx" id="glb-close" type="button">Tutup <svg class="ic" aria-hidden="true"><use href="#i-close"></use></svg></button>
  <video id="glb-video" controls muted playsinline></video>
  <img id="glb-snap" alt="" style="display:none">
  <iframe id="glb-frame" allow="autoplay; fullscreen" style="display:none"></iframe>
  <div class="glb-err" id="glb-err" style="display:none" role="status">
    <div class="glb-err-code">NO SIGNAL</div>
    <div class="glb-err-msg" id="glb-err-msg">Kamera sedang offline atau tidak mengirim frame video.</div>
  </div>
  <div class="gcap" id="glb-cap"></div>
</div>
